[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phonological-posteriogram"
# Version is read from git tags via setuptools-scm at build time.
# Git tags are the single source of truth for versioning.
dynamic = ["version"]
description = "Phone recognition and segmentation using phonological posteriograms over SSL speech features."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Kwanghee Choi", email = "juice500ml@gmail.com"},
]
keywords = [
    "speech",
    "phonology",
    "phoneme",
    "segmentation",
    "ssl",
    "wavlm",
    "wav2vec2",
    "hubert",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Inference-only dependencies. Loads pretrained models via .from_pretrained()
# and runs the underlying SSL encoder on raw audio.
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "torch>=1.13",
    "torchaudio>=0.13",
    "transformers>=4.30",
    "huggingface-hub>=0.19",
    "librosa>=0.10",
]

[project.optional-dependencies]
# Adds dataset preparation + SSL feature dumping used during training.
# The training pipeline is just: run SSL inference, dump features, fit on
# them (similar in spirit to k-means on SSL features), so the only extra
# deps are dataset/labeling utilities and panphon for IPA featuralization.
# (The silence detector is now derived from pv_ipa's "speech+" projection,
#  so we no longer need a separate scikit-learn classifier.)
train = [
    "praatio>=6.0",
    "panphon>=0.20",
    "tqdm>=4.64",
]
dev = [
    "pytest>=7.0",
    "ruff",
    "pre-commit",
    "python-semantic-release[build]",
]

[project.scripts]
phonological-posteriogram = "phonological_posteriogram.cli:main"

[project.urls]
Homepage = "https://github.com/juice500ml/phonological-posteriogram"
Repository = "https://github.com/juice500ml/phonological-posteriogram"
Issues = "https://github.com/juice500ml/phonological-posteriogram/issues"

[tool.setuptools]
packages = ["phonological_posteriogram", "phonological_posteriogram.training"]

[tool.setuptools_scm]
write_to = "phonological_posteriogram/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.semantic_release]
# Git tags are the single source of truth; setuptools-scm reads from them.
version_variable = []
build_command = "python -m build"
dist_path = "dist"
commit_author = "github-actions <github-actions@users.noreply.github.com>"
upload_to_vcs_release = true
upload_to_pypi = false
hvcs = "github"
tag_commit = true
changelog_file = "CHANGELOG.md"
