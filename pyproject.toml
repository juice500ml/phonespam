[build-system]
# setuptools >= 77 is required for the PEP 639 `license`/`license-files` fields.
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phonespam"
# Version is read from git tags via setuptools-scm at build time.
# Git tags are the single source of truth for versioning.
dynamic = ["version"]
description = "Phone segmentation and recognition through S3M-based Phonological Activation Mapping (SPAM)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Shikhar Bharadwaj"},
    {name = "Kwanghee Choi", email = "juice500ml@gmail.com"},
    {name = "Stephen McIntosh"},
]
keywords = [
    "speech",
    "phonology",
    "phoneme",
    "segmentation",
    "ssl",
    "wavlm",
    "wav2vec2",
    "hubert",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    # 2.0 is the first release supporting the Python versions we claim;
    # 3.13 wheels only exist from 2.6, which pip resolves to on its own.
    "torch>=2.0",
    "torchaudio>=2.0",
    "transformers>=4.30",
    "huggingface-hub>=0.19",
    "requests>=2.25",
    "librosa>=0.10",
    "panphon>=0.20",
]

[project.optional-dependencies]
# PyPI rejects direct URL (`@ git+https://...`) requirements anywhere in
# published metadata, extras included, so `phone-metrics` cannot live here.
# It is declared in the `train` dependency group below instead; only
# `phonespam.training.prepare_datasets` and `scripts/evaluate_metrics.py`
# need it, and both fail with an install hint if it is missing.
train = [
    "tqdm>=4.64",
]
dev = [
    "pytest>=7.0",
    "ruff==0.16.7",
    "pre-commit",
]

# PEP 735 groups are development-only and never end up in the built
# wheel/sdist metadata, so a direct URL is legal here.
# Install with `uv sync --group train` or `pip install --group train .`
# (pip >= 25.1); otherwise install phone-metrics by hand, see the README.
[dependency-groups]
train = [
    "phone-metrics @ git+https://github.com/stephenmac7/phone-metrics@v0.1.0",
]

[project.urls]
Homepage = "https://github.com/juice500ml/phonespam"
Repository = "https://github.com/juice500ml/phonespam"
Issues = "https://github.com/juice500ml/phonespam/issues"

[tool.uv.sources]
phone-metrics = { git = "https://github.com/stephenmac7/phone-metrics.git", tag = "v0.1.0" }

[tool.setuptools.packages.find]
include = ["phonespam*"]

[tool.setuptools.package-data]
phonespam = ["py.typed"]

[tool.setuptools_scm]
# `write_to` is the deprecated spelling; `version_file` is the setuptools-scm 8 name.
version_file = "phonespam/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
# The committed notebooks are figure-generation scratch, not shipped code.
# They hold hand-aligned data tables that ruff-format would reflow, and their
# lint findings (unused imports kept for interactive use, bare zip()) are not
# defects worth failing CI over.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.semantic_release]
# Git tags are the single source of truth: setuptools-scm reads the version
# from them at build time, so there is no version string in the tree for
# semantic-release to rewrite. Hence both version_* lists stay empty.
version_variables = []
version_toml = []
tag_format = "v{version}"
commit_parser = "conventional"
build_command = "python -m build"
commit_author = "github-actions <github-actions@users.noreply.github.com>"
# [skip ci] is belt-and-braces: pushes made with GITHUB_TOKEN already do not
# retrigger workflows, which is what keeps publish.yml from looping on the
# release commit it pushes itself.
commit_message = "chore(release): v{version} [skip ci]"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.changelog]
# There is no CHANGELOG.md in this repo -- publish.yml passes `changelog: false`
# so semantic-release never writes one, and the per-release notes live on the
# GitHub release instead. This still filters those notes.
exclude_commit_patterns = ['^chore\(release\):']

[tool.semantic_release.publish]
# Attach the built artifacts to the GitHub release. The PyPI upload is a
# separate step in publish.yml so it can use trusted publishing (OIDC).
upload_to_vcs_release = true
dist_glob_patterns = ["dist/*"]

[tool.semantic_release.remote]
type = "github"
