[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phonological-posteriogram"
# Version is read from git tags via setuptools-scm at build time.
# Git tags are the single source of truth for versioning.
dynamic = ["version"]
description = "Phone recognition and segmentation using phonological posteriograms over SSL speech features."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Shikhar Bharadwaj"},
    {name = "Kwanghee Choi", email = "juice500ml@gmail.com"},
    {name = "Stephen McIntosh"},
]
keywords = [
    "speech",
    "phonology",
    "phoneme",
    "segmentation",
    "ssl",
    "wavlm",
    "wav2vec2",
    "hubert",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "torch>=1.13",
    "torchaudio>=0.13",
    "transformers>=4.30",
    "huggingface-hub>=0.19",
    "librosa>=0.10",
    "panphon>=0.20",
]

[project.optional-dependencies]
train = [
    "phone-metrics @ git+https://github.com/stephenmac7/phone-metrics@v0.1.0",
    "tqdm>=4.64",
]
dev = [
    "pytest>=7.0",
    "ruff==0.16.7",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/juice500ml/spam"
Repository = "https://github.com/juice500ml/spam"
Issues = "https://github.com/juice500ml/spam/issues"

[tool.setuptools]
packages = ["phonological_posteriogram", "phonological_posteriogram.training"]

[tool.setuptools.package-data]
phonological_posteriogram = ["data/phoible.csv"]

[tool.setuptools_scm]
write_to = "phonological_posteriogram/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
