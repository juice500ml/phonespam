name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.13"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # setuptools-scm needs the full history to resolve the version from tags

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[train,dev]"
        pip install pre-commit

    - name: Run pre-commit
      run: pre-commit run --all-files
      continue-on-error: false

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short

    - name: Check code formatting
      run: |
        ruff check phonological_posteriogram/ tests/
        ruff format --check phonological_posteriogram/ tests/
      continue-on-error: true

  install-inference-only:
    # Verify the default (no extras) install path still imports cleanly.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install (inference only)
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Smoke-test inference import
      run: |
        python -c "import phonological_posteriogram as pp; print(pp.__version__); from phonological_posteriogram import PhonologicalPosteriogram, Segmenter"
