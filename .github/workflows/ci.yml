name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.13"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # setuptools-scm needs the full history to resolve the version from tags

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[train,dev]"
        # Not on PyPI, so it cannot be an extra; see pyproject [dependency-groups].
        pip install "phone-metrics @ git+https://github.com/stephenmac7/phone-metrics@v0.1.0"

    # The PHOIBLE table (~26 MB) is fetched on first use and pinned by commit,
    # so the cache key only changes when the pin in phonespam/phoible.py does.
    - name: Cache PHOIBLE table
      uses: actions/cache@v4
      with:
        path: ~/.cache/phonespam
        key: phoible-${{ hashFiles('phonespam/phoible.py') }}

    - name: Run pre-commit
      run: pre-commit run --all-files

    - name: Lint and format check
      run: |
        ruff check phonespam/ tests/ scripts/
        ruff format --check phonespam/ tests/ scripts/

    - name: Run tests
      run: pytest tests/ -v --tb=short

  build:
    # Builds the real artifacts and installs them the way a user would. An
    # editable install proves nothing about packaging: it cannot catch a
    # missing package, absent package data, or metadata PyPI would reject.
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # setuptools-scm needs tags to resolve the version

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        ls -l dist/

    - name: Check distribution metadata
      run: twine check --strict dist/*

    - name: Reject direct URL requirements
      # PyPI refuses any `name @ git+https://...` requirement in published
      # metadata, extras included. phone-metrics is the live temptation here
      # (see pyproject [dependency-groups]), and the upload would fail only
      # after a release tag had already been pushed.
      run: |
        python - <<'EOF'
        import glob, zipfile
        from packaging.requirements import InvalidRequirement, Requirement

        whl = glob.glob("dist/*.whl")[0]
        with zipfile.ZipFile(whl) as z:
            name = next(n for n in z.namelist() if n.endswith("METADATA"))
            meta = z.read(name).decode()
        # Parse rather than string-match: setuptools emits "name@ url" with no
        # space before the @, so a naive " @ " search silently misses every
        # real direct reference.
        bad = []
        for ln in meta.splitlines():
            if not ln.startswith("Requires-Dist:"):
                continue
            spec = ln.split(":", 1)[1].strip()
            try:
                if Requirement(spec).url:
                    bad.append(ln)
            except InvalidRequirement as e:
                bad.append(f"{ln}   <- unparseable: {e}")
        if bad:
            raise SystemExit(
                "PyPI will reject these direct URL requirements:\n  " + "\n  ".join(bad)
            )
        print("no direct URL requirements")
        EOF

    - name: Reject bundled PHOIBLE table
      # The ~26 MB table is downloaded at runtime; committing it back into the
      # package would quietly inflate every wheel by three orders of magnitude.
      run: |
        if unzip -l dist/*.whl | grep -q "phoible.csv"; then
          echo "::error::phoible.csv is bundled in the wheel; it must be fetched at runtime"
          exit 1
        fi
        echo "phoible.csv correctly absent"

    - name: Install the wheel into a clean environment
      run: |
        python -m venv /tmp/wheeltest
        /tmp/wheeltest/bin/pip install --upgrade pip
        /tmp/wheeltest/bin/pip install dist/*.whl

    - name: Smoke-test the installed package
      # Run from outside the checkout so the source tree cannot shadow the
      # installed package and mask a packaging error.
      working-directory: /tmp
      run: |
        /tmp/wheeltest/bin/python -c "
        import phonespam
        print('version:', phonespam.__version__)
        print('loaded from:', phonespam.__file__)
        assert 'site-packages' in phonespam.__file__, 'imported the source tree, not the wheel'
        from phonespam import PhoneModel, PhonologicalPosteriogram, Recognizer, Segmenter
        import phonespam.training, phonespam.phoible
        import importlib.resources as r
        assert r.files('phonespam').joinpath('py.typed').is_file(), 'py.typed missing from the wheel'
        print('ok')
        "

    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
